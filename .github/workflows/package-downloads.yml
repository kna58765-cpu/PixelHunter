name: Package Android and iOS ZIPs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android APK
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html app/src/main/assets/www/index.html
          cp icon.svg app/src/main/assets/www/icon.svg
          cp manifest.webmanifest app/src/main/assets/www/manifest.webmanifest
          mkdir -p app/src/main/assets/www/assets
          cp -R assets/. app/src/main/assets/www/assets/
          gradle --no-daemon assembleDebug
      - name: Build separate ZIP packages
        run: |
          mkdir -p out/android out/ios/PixelHunter-iOS-I1.5.3
          cp app/build/outputs/apk/debug/app-debug.apk out/android/PixelHunter-Android-1.5.3.apk
          cp ios/index.html ios/manifest.webmanifest ios/sw.js out/ios/PixelHunter-iOS-I1.5.3/
          cp -R assets out/ios/PixelHunter-iOS-I1.5.3/
          cp icon.svg out/ios/PixelHunter-iOS-I1.5.3/
          cd out/android && zip -q ../../PixelHunter-Android-1.5.3.zip PixelHunter-Android-1.5.3.apk
          cd ../../out/ios && zip -qr ../../PixelHunter-iOS-I1.5.3.zip PixelHunter-iOS-I1.5.3
      - name: Publish ZIPs to downloads folder
        run: |
          mkdir -p downloads
          cp PixelHunter-Android-1.5.3.zip downloads/
          cp PixelHunter-iOS-I1.5.3.zip downloads/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add downloads/*.zip
          git commit -m "Publish Android 1.5.3 APK bundle and iOS I1.5.3 ZIP" || exit 0
          git push
