<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090d1c"><meta name="description" content="PIXEL HUNTER：像素怪物生存游戏">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest">
<title>PIXEL HUNTER · 像素猎手</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;color:#eaf4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#182746 0,#090d1c 65%)}#shell{width:min(100vw,960px);height:min(100dvh,600px);display:flex;flex-direction:column;padding:10px;gap:8px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:1000;letter-spacing:2px;font-size:clamp(15px,3vw,22px)}.brand span{color:#48e5ef}.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.stat{background:#121d32;border:1px solid #263a5a;border-radius:9px;padding:5px 9px;font-size:12px;color:#a9c1df}.stat b{color:#fff;margin-left:4px}#stage{position:relative;flex:1;min-height:0;border:2px solid #294367;border-radius:14px;overflow:hidden;background:#101b2c;box-shadow:0 15px 50px #0009}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#070b16d9;text-align:center;padding:20px}.panel{max-width:440px}.panel h1{font-size:clamp(27px,7vw,48px);line-height:1;margin:0 0 10px;letter-spacing:2px}.panel h1 em{color:#49e6ed;font-style:normal}.panel p{color:#a9bdd7;line-height:1.6;font-size:14px}.mainbtn{border:0;border-radius:10px;background:linear-gradient(135deg,#37d9e8,#5487ff);color:#07101d;font-weight:900;font-size:16px;padding:12px 26px;box-shadow:0 5px 20px #35d9e855}.hint{font-size:11px!important;color:#7189a8!important}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:104px}.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,42px);gap:4px}.ctrl{border:1px solid #355276;background:#172640;color:#e8f6ff;border-radius:10px;font-size:18px;font-weight:900;touch-action:none;user-select:none}.ctrl:active,.ctrl.on{background:#28617a;border-color:#50e5ef}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.actions{display:flex;gap:9px;align-items:center}.attack{width:76px;height:76px;border-radius:50%;background:linear-gradient(145deg,#ff9b55,#ec476a);border:3px solid #ffd0a0;color:#220d19;font-size:13px;font-weight:1000;box-shadow:0 5px 20px #f35a6566}.smallbtn{padding:9px 11px;font-size:12px;border:1px solid #355276;border-radius:9px;background:#172640;color:#dcecff}.bottom{font-size:10px;color:#657d9d;text-align:center}@media(min-width:700px){.controls{min-height:78px}.pad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,32px)}.ctrl{font-size:14px}.attack{width:60px;height:60px}}
</style>
</head>
<body><main id="shell">
<header class="top"><div class="brand">PIXEL <span>HUNTER</span></div><div class="stats"><div class="stat">得分<b id="score">0</b></div><div class="stat">生命<b id="hp">♥♥♥♥♥</b></div><div class="stat">时间<b id="time">00:00</b></div><div class="stat">击杀<b id="kills">0</b></div></div></header>
<section id="stage"><canvas id="game" width="480" height="270"></canvas><div id="overlay"><div class="panel"><h1>PIXEL <em>HUNTER</em></h1><p>怪物正在逼近。拿起武器，尽可能活下去！<br>击败怪物获得积分，撑过一波又一波。</p><button class="mainbtn" id="start">开始狩猎</button><p class="hint">电脑：WASD / 方向键移动，空格攻击<br>手机：左侧方向键移动，右侧按钮攻击</p></div></div></section>
<section class="controls"><div class="pad"><button class="ctrl up" data-dir="up">▲</button><button class="ctrl left" data-dir="left">◀</button><button class="ctrl down" data-dir="down">▼</button><button class="ctrl right" data-dir="right">▶</button></div><div class="actions"><button class="smallbtn" id="pause">暂停</button><button class="attack" id="hit">挥剑<br>ATTACK</button></div></section><footer class="bottom">PIXEL HUNTER · SURVIVE THE NIGHT · 本地最高分 <span id="best">0</span></footer>
</main>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay');
const $=id=>document.getElementById(id);
let state='menu',player,monsters,particles,score,kills,elapsed,last,spawn,attackCd,hitFlash,best=+(localStorage.phBest||0),keys={},touch={},bossMade=false;
$('best').textContent=best;
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function reset(){player={x:240,y:135,hp:5,inv:0,face:0};monsters=[];particles=[];score=0;kills=0;elapsed=0;spawn=0;attackCd=0;hitFlash=0;bossMade=false;last=performance.now();updateHUD()}
function updateHUD(){$('score').textContent=score;$('hp').textContent='♥'.repeat(Math.max(0,player?.hp||0))+'♡'.repeat(Math.max(0,5-(player?.hp||0)));$('kills').textContent=kills;$('time').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('best').textContent=best}
function spawnMonster(boss=false){let side=Math.floor(rand(0,4)),x=side===0?-8:side===1?488:rand(0,480),y=side===2?-8:side===3?278:rand(0,270);let type=boss?'boss':['slime','skeleton','bat'][Math.floor(rand(0,3))];monsters.push({x,y,type,hp:boss?18:type==='skeleton'?3:2,speed:boss?22:type==='bat'?48:rand(25,36),size:boss?15:type==='skeleton'?9:8,flash:0})}
function burst(x,y,color,n=7){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-55,55),vy:rand(-55,55),life:rand(.2,.5),color})}
function attack(){if(state!=='playing'||attackCd>0)return;attackCd=.34;let range=43,hit=false;for(let m of monsters){let dx=m.x-player.x,dy=m.y-player.y,d=Math.hypot(dx,dy);if(d<range+m.size){m.hp-=m.type==='boss'?2:3;m.flash=.12;hit=true;burst(m.x,m.y,'#ffd16b',4);if(m.hp<=0){score+=m.type==='boss'?250:m.type==='skeleton'?35:m.type==='bat'?25:20;kills++;burst(m.x,m.y,m.type==='boss'?'#e35bff':'#56e9db',12);m.dead=true}}}if(hit)updateHUD();monsters=monsters.filter(m=>!m.dead)}
function move(dt){let dx=0,dy=0;if(keys.ArrowLeft||keys.a||touch.left)dx--;if(keys.ArrowRight||keys.d||touch.right)dx++;if(keys.ArrowUp||keys.w||touch.up)dy--;if(keys.ArrowDown||keys.s||touch.down)dy++;let l=Math.hypot(dx,dy)||1;player.x=Math.max(10,Math.min(470,player.x+dx/l*105*dt));player.y=Math.max(12,Math.min(258,player.y+dy/l*105*dt));if(dx||dy)player.face=Math.atan2(dy,dx)}
function update(dt){elapsed+=dt;spawn-=dt;attackCd=Math.max(0,attackCd-dt);player.inv=Math.max(0,player.inv-dt);if(spawn<=0){spawn=Math.max(.42,1.45-elapsed*.009);spawnMonster()}if(elapsed>60&&!bossMade){spawnMonster(true);bossMade=true}
move(dt);for(let m of monsters){let dx=player.x-m.x,dy=player.y-m.y,l=Math.hypot(dx,dy)||1;m.x+=dx/l*m.speed*dt;m.y+=dy/l*m.speed*dt;if(l<m.size+7&&player.inv<=0){player.hp--;player.inv=1.05;hitFlash=.18;burst(player.x,player.y,'#ff617a',9);if(player.hp<=0)endGame()}}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);hitFlash=Math.max(0,hitFlash-dt);monsters.forEach(m=>m.flash=Math.max(0,m.flash-dt));if(Math.floor(elapsed)!==Math.floor(elapsed-dt))updateHUD()}
function pixelRect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){ctx.clearRect(0,0,480,270);ctx.fillStyle='#101c2d';ctx.fillRect(0,0,480,270);for(let y=8;y<270;y+=24)for(let x=8;x<480;x+=24){ctx.fillStyle=((x+y)/24)%2?'#15243a':'#142238';ctx.fillRect(x,y,1,1)}ctx.strokeStyle='#253b58';ctx.lineWidth=2;ctx.strokeRect(4,4,472,262);
for(let i=0;i<8;i++){let x=(i*71+19)%470,y=(i*43+30)%260;ctx.fillStyle='#1c3047';ctx.fillRect(x,y,3,3)}
for(let m of monsters){let x=Math.round(m.x),y=Math.round(m.y),col=m.flash?'#fff':m.type==='boss'?'#b14be7':m.type==='skeleton'?'#c9d5d5':m.type==='bat'?'#8c79dc':'#45c9a0';if(m.type==='boss'){pixelRect(x-12,y-11,24,22,col);pixelRect(x-16,y-5,4,11,'#7137a9');pixelRect(x+12,y-5,4,11,'#7137a9');pixelRect(x-7,y-3,4,4,'#ffdf68');pixelRect(x+3,y-3,4,4,'#ffdf68')}else if(m.type==='skeleton'){pixelRect(x-6,y-8,12,10,col);pixelRect(x-8,y+3,5,8,col);pixelRect(x+3,y+3,5,8,col);pixelRect(x-4,y-4,2,2,'#182238');pixelRect(x+2,y-4,2,2,'#182238')}else if(m.type==='bat'){pixelRect(x-4,y-5,8,10,col);pixelRect(x-12,y-7,8,6,col);pixelRect(x+4,y-7,8,6,col);pixelRect(x-2,y-2,2,2,'#ffcf68')}else{pixelRect(x-8,y-5,16,12,col);pixelRect(x-5,y-8,10,4,col);pixelRect(x-4,y-1,2,2,'#152238');pixelRect(x+2,y-1,2,2,'#152238')}if(m.type==='boss'){ctx.fillStyle='#351b46';ctx.fillRect(x-14,y-19,28,3);ctx.fillStyle='#ff5c9b';ctx.fillRect(x-14,y-19,28*m.hp/18,3)}}
for(let p of particles){ctx.globalAlpha=Math.max(0,p.life*2);pixelRect(p.x,p.y,3,3,p.color)}ctx.globalAlpha=1;
if(player){ctx.save();ctx.translate(Math.round(player.x),Math.round(player.y));ctx.rotate(player.face);if(player.inv>0&&Math.floor(player.inv*12)%2)ctx.globalAlpha=.35;pixelRect(-6,-7,12,14,'#253d65');pixelRect(-5,-10,10,7,'#18243d');pixelRect(-3,-7,7,3,'#4ce6ed');pixelRect(-4,5,3,5,'#8fb7d8');pixelRect(2,5,3,5,'#8fb7d8');pixelRect(4,-2,12,3,'#d8e8f6');pixelRect(13,-4,3,7,'#59e7ef');ctx.restore()}if(hitFlash){ctx.fillStyle='#ff405522';ctx.fillRect(0,0,480,270)}}
function loop(now){if(state==='playing'){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt)}else last=now;draw();requestAnimationFrame(loop)}
function start(){reset();state='playing';overlay.style.display='none';$('pause').textContent='暂停'}
function pause(){if(state==='playing'){state='paused';overlay.style.display='flex';overlay.innerHTML='<div class="panel"><h1>暂 <em>停</em></h1><p>猎场暂时安静了。</p><button class="mainbtn" id="resume">继续狩猎</button></div>';$('resume').onclick=()=>{state='playing';last=performance.now();overlay.style.display='none'}}else if(state==='paused'){state='playing';last=performance.now();overlay.style.display='none'}}
function endGame(){state='over';if(score>best){best=score;localStorage.phBest=best}updateHUD();overlay.style.display='flex';overlay.innerHTML='<div class="panel"><h1>狩猎 <em>结束</em></h1><p>最终得分：<b>'+score+'</b><br>击败怪物：'+kills+' 只 · 生存：'+Math.floor(elapsed)+' 秒<br>本地最高分：'+best+'</p><button class="mainbtn" id="again">再战一次</button></div>';$('again').onclick=start}
$('start').onclick=start;$('pause').onclick=pause;$('hit').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();touch[d]=true;b.classList.add('on');b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{touch[d]=false;b.classList.remove('on')}))});
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();attack()}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);addEventListener('blur',()=>{keys={};touch={}});
reset();requestAnimationFrame(loop);
})();
</script></body></html>
