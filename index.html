}

function reset(){victory=false;mapTransition=0;mapBiome=0;transitionBiome=0;player={x:240,y:135,hp:5,inv:0,face:1};swingTimer=0;joystickVector={x:0,y:0};setStick(0,0);$('weaponPick').textContent='武器：'+weaponLabel();skillCd=0;$('skill').disabled=false;$('skill').innerHTML='火焰<br>就绪';monsters=[];particles=[];pickups=[];projectiles=[];blockCd=0;blockTimer=0;blockFlash=0;camera={x:0,y:0};aimVector={x:player.face||1,y:0};ruins=[{x:70,y:65},{x:405,y:58},{x:90,y:215},{x:390,y:205},{x:240,y:38}];score=0;kills=0;elapsed=0;spawn=0;attackCd=0;hitFlash=0;bossMade=0;weaponLevel=1;wave=1;nextUpgrade=120;last=performance.now();updateHUD()}
function updateHUD(){$('score').textContent=score;$('weaponPick').textContent='武器：'+weaponNames[weaponMode];$('hp').textContent='♥'.repeat(Math.max(0,player?.hp||0))+'♡'.repeat(Math.max(0,5-(player?.hp||0)));$('kills').textContent=kills;$('wave').textContent=wave;$('weapon').textContent=weaponLabel()+' Lv.'+weaponLevel;$('time').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('best').textContent=best;applyLanguage()}
function spawnMonster(boss=false){let side=Math.floor(rand(0,4)),x=player.x+(side===0?-270:side===1?270:rand(-240,240)),y=player.y+(side===2?-155:side===3?155:rand(-135,135));let pool=elapsed<35?['slime','skeleton','bat']:['slime','skeleton','bat','brute','wisp'];let type=boss?(typeof boss==='string'?boss:'boss'):pool[Math.floor(rand(0,pool.length))],isB=!!boss,brute=type==='brute',wisp=type==='wisp',hp=isB?(type==='finalBoss'?200+wave*4:type==='voidBoss'?110+wave*3:55+wave*2):brute?7+wave:type==='skeleton'?3+Math.floor(wave/3):wisp?2:2+Math.floor(wave/4);monsters.push({x,y,type,skinIndex:Math.floor(rand(0,3)),hp,maxHp:isB?hp:0,speed:(isB?22+wave*1.5:brute?Math.max(18,25+wave*.5):type==='bat'?48+wave*1.2:wisp?58+wave:rand(25,36)+wave*1.3)*(difficulty==='easy'?.82:difficulty==='hard'?1.2:1),size:isB?15:brute?12:type==='skeleton'?9:8,flash:0,attackTimer:2.5,attackFx:0,attackAngle:0})}

function sound(freq,duration=.09,type='sine',volume=.035){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.55),audioCtx.currentTime+duration);g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function castBlock(){if(state!=='playing'||blockCd>0)return;blockTimer=.42;blockCd=3;blockFlash=.42;sound(340,.12,'triangle',.04);burst(player.x+player.face*10,player.y,'#8feaff',10)}function castSkill(){if(state!=='playing'||skillCd>0)return;skillCd=8;burst(player.x,player.y,'#ff9b42',38);burst(player.x,player.y,'#ffe36b',24);sound(180,.35,'sawtooth',.07);let hitCount=0;for(let m of monsters){if(dist(player,m)<92){m.hp-=isBoss(m.type)?(m.type==='finalBoss'?99:m.type==='voidBoss'?11:8):99;m.flash=.25;hitCount++;burst(m.x,m.y,'#ffad42',12);if(m.hp<=0){sound(isBoss(m.type)?95:260,.16,'triangle',.035);score+=isBoss(m.type)?(m.type==='finalBoss'?1000:m.type==='voidBoss'?500:300):m.type==='skeleton'?35:m.type==='bat'?25:20;kills++;totalKills++;coins+=isBoss(m.type)?10:1;localStorage.phKills=totalKills;localStorage.phCoins=coins;if(score>=nextUpgrade){weaponLevel=Math.min(8,weaponLevel+1);nextUpgrade+=150+weaponLevel*35}if(isBoss(m.type)||Math.random()<.28)pickups.push({x:m.x,y:m.y,type:!isBoss(m.type)&&Math.random()<.16?(Math.random()<.5?'gearBow':'gearSpear'):(m.type==='boss'||Math.random()<.35?'heal':'crystal'),life:12,phase:rand(0,6.28)});m.dead=true}}}if(monsters.some(m=>m.type==='finalBoss'&&m.hp<=0))victory=true;monsters=monsters.filter(m=>!m.dead);updateHUD();if(victory)winGame();}

// Android WebView: handle menu taps on touchend and call the bound action directly.
overlay.addEventListener('touchend',e=>{
 const target=e.target&&e.target.nodeType===1?e.target:e.target?.parentElement;
 const b=target?.closest('button');
 if(!b||b.disabled)return;
 e.preventDefault();
 e.stopPropagation();
 if(typeof b.onclick==='function') b.onclick.call(b,e);
 else b.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));
},{passive:false,capture:true});
